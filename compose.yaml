name: ecommerce-cms-dev

x-app-env: &app-env
  APP_NAME: "Ecommerce CMS API"
  APP_ENV: local
  APP_KEY: "${APP_KEY:-base64:c/S8Ggw22FQI2tOxZhxkHPVIZjd9wBGhwsRvNX60Q98=}"
  APP_DEBUG: "true"
  APP_URL: "${APP_URL:-http://localhost:8000}"
  APP_LOCALE: vi
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stack
  LOG_LEVEL: debug

  # Storefront + Admin cùng origin qua gateway
  FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8000}"
  ADMIN_URL: "${ADMIN_URL:-http://localhost:8000}"
  SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-localhost:8000,127.0.0.1:8000}"

  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: "${POSTGRES_DB:-ecommerce_cms}"
  DB_USERNAME: "${POSTGRES_USER:-postgres}"
  DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"

  CACHE_STORE: database
  QUEUE_CONNECTION: database
  SESSION_DRIVER: database
  SESSION_LIFETIME: 120

  ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@example.com}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD:-ChangeMe123!}"

  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
  GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: "${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:-/var/www/html/storage/app/google-service-account.json}"
  GOOGLE_DRIVE_FOLDER_ID: "${GOOGLE_DRIVE_FOLDER_ID:-}"
  GOOGLE_DRIVE_SHARED_DRIVE_ID: "${GOOGLE_DRIVE_SHARED_DRIVE_ID:-}"

  FACEBOOK_APP_ID: "${FACEBOOK_APP_ID:-}"
  FACEBOOK_APP_SECRET: "${FACEBOOK_APP_SECRET:-}"
  FACEBOOK_GRAPH_VERSION: "${FACEBOOK_GRAPH_VERSION:-v23.0}"

  MEDIA_MAX_KB: "${MEDIA_MAX_KB:-10240}"

services:
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    depends_on:
      app:
        condition: service_healthy
      admin:
        condition: service_started
      storefront:
        condition: service_started
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      <<: *app-env
      APP_INIT: "1"
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      AUTO_SEED: "${AUTO_SEED:-true}"
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - composer-cache:/tmp/composer/cache
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  storefront:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      NUXT_PUBLIC_API_BASE: "/api/v1"
      HOST: "0.0.0.0"
      PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - storefront-node-modules:/app/node_modules
    expose:
      - "3000"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: "/api/admin/v1"
      VITE_APP_BASE: "/admin/"
      VITE_HMR_CLIENT_PORT: "${GATEWAY_PORT:-8000}"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./admin:/app
      - admin-node-modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ecommerce_cms}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      TZ: Asia/Bangkok
    # PostgreSQL chỉ mở trong Docker network. Laravel/pgAdmin truy cập qua postgres:5432.
    # Không publish 5432 ra Windows để tránh xung đột với PostgreSQL cài sẵn hoặc reserved ports.
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce_cms}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["workers"]
    environment:
      <<: *app-env
      APP_INIT: "0"
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - composer-cache:/tmp/composer/cache
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["workers"]
    environment:
      <<: *app-env
      APP_INIT: "0"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - composer-cache:/tmp/composer/cache
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@example.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-admin123456}"
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  vendor:
  composer-cache:
  pgadmin-data:
  admin-node-modules:
  storefront-node-modules:
